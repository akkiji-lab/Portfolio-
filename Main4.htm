<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Button</title>
 <style>
   body, html {
     height: 200%;
     margin: 0;
     width: 100%;
     background-color: black;
   }
    .menu{
     height: 40px;
     width: 100vw;
     border: 0.5px solid black;
     background-color: #efefef;
     display: flex;
  
   }
   .menu-bar{
     display: flex;
     flex-direction: row;
     align-items: center;
     gap: 5rem;
     margin-left: auto;
     margin-right: 20px;
   }
   .logo{
     padding: 4px 4px 4px 20px;
     align-items: center;
     justify-content: center;
   }
   .logo-img {
     width: 30px;
     height: auto;
     border: 0.5px solid #aeaeae;
     border-radius: 50%;
    
   }
   .container{
     display: none;
     cursor: pointer;
     margin: 8px 10px 4px auto;
   }
   .bar1, .bar2, .bar3{
     width: 20px;
     height: 3px;
     background-color: #333;
     margin: 4px 0;
     transition: 0.1s;
     border-radius: 5px;
   }
   a {
     text-decoration: none;
     color: black;
   }
   .change .bar1 {
     transform: translate(0, 7px) rotate(45deg);
   }
   .change .bar2 {
     opacity: 0;
   }
   .change .bar3 {
     transform: translate(0, -7px) rotate(-45deg);
   }
   .hero-profile {
     display: grid;
     grid-template-columns: 1fr 1fr;
     gap: 20px;
     align-items: center;
     background-color: #fafafa;
     border-bottom: 1px solid black;
   }
  
   .hero-text{
     font-family: "Segoe UI", Sans-Serif;
     font-size: 1.5rem;
     text-align: center;
     align-content: center;
     margin: 40px 40px 0 40px;
     
   }
   .hero-photo{
     margin: 20px;
     display: flex;
     justify-content: center;
     
   }
   .profile-img{
     width: 75%;
     height: auto;
     
     align-content: center;
     justify-content: center;
     border: 0.5px solid black;
     border-radius: 20px;
     
   }
   .hamburger{
     font-size: 30px;
     font-family: Sans-Serif;
     color: #1628b9;
   }
   .about {
    color: #0000008f;
   }
   footer {
     position: fixed;
     bottom: 0;
     width: 100%;
     height: 20px;
     margin-top: 20px;
     text-align: center;
     border-top: 0.5px solid black;
   }
   .project {
     display: grid;
     grid-template-columns: 1fr 1fr 1fr;
     margin: 4rem;
     gap: 4rem;
     justify-content: space-evenly;
     margin-top: 20px;
   }
   .project-card{
     background-color: #111;
     border: 2px solid #333 ;
     padding: 8px;
     border-radius: 15px;
   }
   .project-info{
     font-size: 2rem;
     color: #21b157;
   }
   @media (max-width: 768px) {
     .hero-profile {
       grid-template-columns: 1fr;
     }
     .profile-img{
       width: 50%;
     }
     .hero-text{
       font-size: 1rem;
     }
     .container {
       display: block;
     }
     .menu-bar, a{
       display: none;
     }
     .project {
       grid-template-columns: 1fr;
     }
   }
   @keyframes showMenu{
     0% {
       
     }
   }
 </style>
</head>
<body>
  <section>
    <nav>
      <div class="menu">
        <div class="logo">
          <img class="logo-img" src="https://raw.githubusercontent.com/akkiji-lab/Portfolio-/main/logo.jpg" alt="akki's logo">
        </div>
        <div class="container" onclick="myFunction(this)">
          <div class="bar1"></div>
          <div class="bar2"></div>
          <div class="bar3"></div>
        </div>
        <div class="menu-bar">
          <ul>
            <li><a href="#">home</a></li>
            <li><a href="#">projects</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">About us</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </section>
    <main>
      <div class="hero-profile">
        <div class="hero-text">Hii, I'm <br><span class="hamburger">Ankit Singh.</span><br>
          <span class="about">A frontend developer who design accessible and responsive websites for businesses, portfolios </span>)
       </div>
       <div class="hero-photo">
         <img class="profile-img" src="https://raw.githubusercontent.com/akkiji-lab/Portfolio-/main/ankit.jpg" alt="ankit ji">
       </div>
  
     </div>
    </main>
    <section class="project">
      <div class="project-card">
        <span class="project-info">&lt;/&gt;</span>
      </div>
      <div class="project-card">
        <span class="project-info">&lt;/&gt;</span>
      </div>
      <div class="project-card">
        <span class="project-info">&lt;/&gt;</span>
      </div>
    </section>
    <footer>
      &copy;Ankit Singh - Built with care
    </footer>

<script>
  function myFunction(x) {
    x.classList.toggle("change");
    x.classList.toggle("show");
  }
</script>

</body>
</html>
